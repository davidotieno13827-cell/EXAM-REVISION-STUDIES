{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[80vh]">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border-t-4 border-blue-900">
        <h2 class="text-2xl font-bold text-center text-slate-900 mb-2">OFSG Member Login</h2>
        <p class="text-center text-sm text-slate-600 mb-6">Access your SACCO dashboard, contribution history, and profile details.</p>

        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-slate-700 font-semibold mb-2">Username</label>
                <input type="text" name="username" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" required>
            </div>

            <div>
                <label class="block text-slate-700 font-semibold mb-2">Password</label>
                <input type="password" name="password" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" required>
            </div>

                <button type="submit" class="w-full brand-btn font-bold py-3 px-4 rounded-lg transition duration-300">
                Secure Login
            </button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
