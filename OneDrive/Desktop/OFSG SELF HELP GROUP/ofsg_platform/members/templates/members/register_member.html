{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white rounded-3xl shadow border border-slate-200 p-8">
    <h1 class="text-3xl font-bold text-slate-900">Create your SACCO account</h1>
    <p class="text-slate-600 mt-2">Register as a new member and get access to the portal.</p>

    <form method="post" enctype="multipart/form-data" class="mt-6 space-y-4">
        {% csrf_token %}
        <div class="grid md:grid-cols-2 gap-4">
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-sm text-accent-maroon mt-1">{{ field.errors|striptags }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="w-full brand-btn py-3 rounded-lg">Register Member</button>
    </form>
</div>
{% endblock %}
