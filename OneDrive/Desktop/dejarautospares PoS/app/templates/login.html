{% extends 'base.html' %}

{% block title %}Login - Dejar Auto Spares{% endblock %}

{% block content %}
    <div class="card shadow-sm border-0" style="max-width: 420px; margin: auto;">
        <div class="card-body p-4">
            <h2 class="card-title mb-2">Welcome back</h2>
            <p class="text-muted mb-4">Sign in to continue using the POS.</p>
            <form method="POST" class="row g-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if next_page %}
                    <input type="hidden" name="next" value="{{ next_page }}">
                {% endif %}
                <div class="col-12">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" autocomplete="username" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password" required>
                </div>
                <div class="col-12 d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Sign in</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
