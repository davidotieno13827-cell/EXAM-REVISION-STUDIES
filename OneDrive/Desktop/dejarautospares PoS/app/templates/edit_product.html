{% extends 'base.html' %}

{% block title %}Edit Product - Dejar Auto Spares{% endblock %}

{% block content %}
    <div class="card shadow-sm" style="max-width: 650px; margin: auto;">
        <div class="card-body">
            <h2 class="card-title mb-4">Edit Product</h2>
            <form method="POST" class="row g-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="col-12">
                    <label class="form-label">SKU</label>
                    <input type="text" name="sku" class="form-control" value="{{ product.sku or '' }}" placeholder="SKU or product code">
                </div>
                <div class="col-12">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Brand</label>
                    <input type="text" name="brand" class="form-control" value="{{ product.brand }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Update Product</button>
                    <a href="{{ url_for('pos.index') }}" class="btn btn-link">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
