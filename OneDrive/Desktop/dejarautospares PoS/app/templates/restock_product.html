{% extends 'base.html' %}

{% block title %}Restock Product - Dejar Auto Spares{% endblock %}

{% block content %}
    <div class="card shadow-sm" style="max-width: 650px; margin: auto;">
        <div class="card-body">
            <h2 class="card-title mb-4">Restock {{ product.name }}</h2>
            <form method="POST" class="row g-3">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="col-12">
                    <label class="form-label">Quantity to Add</label>
                    <input type="number" name="quantity" class="form-control" min="1" value="1" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Add Stock</button>
                    <a href="{{ url_for('pos.index') }}" class="btn btn-link">Back to Inventory</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
