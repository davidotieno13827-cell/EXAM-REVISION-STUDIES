{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Kisii TV</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            text-align: center;
            padding: 40px 20px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #e50914 0%, #cc000d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .error-title {
            font-size: 32px;
            margin: 20px 0;
            color: #ffffff;
        }
        
        .error-message {
            font-size: 16px;
            color: #aaa;
            margin: 20px 0 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        
        .error-icon {
            font-size: 80px;
            color: #e50914;
            margin: 20px 0;
            animation: slideInDown 0.6s ease-out;
        }
        
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #e50914 0%, #cc000d 100%);
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.6);
        }
        
        .error-btn.secondary {
            background: transparent;
            border: 2px solid #e50914;
            color: #e50914;
        }
        
        .error-btn.secondary:hover {
            background: rgba(229, 9, 20, 0.1);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }
            
            .error-title {
                font-size: 24px;
            }
            
            .error-icon {
                font-size: 60px;
            }
            
            .error-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-server"></i>
        </div>
        <h1 class="error-code">500</h1>
        <h2 class="error-title">Server Error</h2>
        <p class="error-message">
            Oops! Something went wrong on our end. Our team has been notified and is working to fix it. Please try again later.
        </p>
        <div class="error-actions">
            <a href="/" class="error-btn">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <a href="{% url 'search' %}" class="error-btn secondary">
                <i class="fas fa-search"></i> Search Videos
            </a>
        </div>
    </div>
</body>
</html>
