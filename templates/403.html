{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden | Kisii TV</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 700px;
            width: 100%;
        }
        .error-code {
            font-size: 110px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
            animation: pulse 2s ease-in-out infinite;
        }
        .error-title {
            font-size: 34px;
            margin: 20px 0 10px;
            color: #ffffff;
        }
        .error-message {
            font-size: 17px;
            color: #aaa;
            margin: 0 auto 30px;
            max-width: 520px;
            line-height: 1.7;
        }
        .error-icon {
            font-size: 70px;
            color: var(--brand-primary);
            margin: 20px 0;
            animation: slideInDown 0.6s ease-out;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .error-btn {
            padding: 14px 34px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 100%);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(200, 16, 46, 0.45);
        }
        .error-btn.secondary {
            background: transparent;
            border: 2px solid var(--brand-primary);
            color: var(--brand-primary);
        }
        .error-btn.secondary:hover {
            background: rgba(200, 16, 46, 0.1);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }
        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }
            .error-title {
                font-size: 26px;
            }
            .error-icon {
                font-size: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="error-code">403</h1>
        <h2 class="error-title">Access Denied</h2>
        <p class="error-message">You don’t have permission to view the editorial dashboard. If you are an editor, please sign in with an account that has editorial access.</p>
        <div class="error-actions">
            <a href="/" class="error-btn">Return Home</a>
            <a href="{% url 'register' %}" class="error-btn" style="background: #0ea5e9; color: #000;">Sign Up</a>
            <a href="{% url 'login' %}" class="error-btn secondary">Sign In</a>
        </div>
    </div>
</body>
</html>
