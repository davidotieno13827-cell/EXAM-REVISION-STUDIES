{% extends 'base.html' %}

{% block extra_css %}
<style>
    .hero-section {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<section class="content-grid-section">
    <div class="page-panel" style="max-width: 520px; margin: 0 auto;">
        <form method="post">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}" />
            {% endif %}
            {{ form.non_field_errors }}
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label class="section-subtitle" style="display: block; margin-bottom: 8px;">Username</label>
                    {{ form.username }}
                </div>
                <div>
                    <label class="section-subtitle" style="display: block; margin-bottom: 8px;">Password</label>
                    <div class="password-input-wrapper">
                        {{ form.password }}
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('id_password', this)" aria-label="Toggle password visibility" title="Show or hide password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </div>
        </form>
        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
            <p class="section-subtitle" style="margin: 0;"><a href="{% url 'password_reset' %}" style="text-decoration:none; color:#1e40af; font-weight:600;">Forgot your password?</a></p>
            <p class="section-subtitle" style="margin: 0;"><a href="{% url 'auth_choice' %}" style="text-decoration:none; color:#1e40af; font-weight:600;">Back to sign-in options</a></p>
        </div>
    </div>
</section>
{% endblock %}
