{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="homepage-hero" style="min-height: 240px;">
    {% if live_videos %}
    <section style="padding: 24px 5%;">
        <div style="background: linear-gradient(135deg, #ff4d4d 0%, #ff7a00 100%); border-radius: 12px; padding: 24px; color: #fff; display: flex; flex-direction: column; gap: 12px;">
            <div style="font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;">Live Now</div>
            <h2 style="margin: 0; font-size: 28px;">{{ live_videos.0.title }}</h2>
            <p style="margin: 0; color: #ffe6e6;">{{ live_videos.0.description|default:"Watch the station live stream now." }}</p>
            <a href="{% url 'video_detail' live_videos.0.slug %}" style="display: inline-block; width: fit-content; padding: 10px 16px; background: #fff; color: #111; font-weight: 700; border-radius: 6px; text-decoration: none;">Watch Live</a>
        </div>
    </section>
    {% endif %}
</div>
{% endblock content %}
